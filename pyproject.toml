# Required by the SiS container runtime: the app won't start without a dependency file.
# Packages install from the attached artifact repository
# (snowflake.snowpark.pypi_shared_repository) — deploy with scripts/deploy.sh.
[project]
name = "knowledge-workbench"
version = "0.1.0"
requires-python = "~=3.11.0"
dependencies = [
    "streamlit[snowflake]==1.66.1",  # pinned to what the live app runs (2026-10-22)
    # SQL editor (chosen 2026-10-22; app/editor_spike.py is its options playground).
    "streamlit-code-editor==0.1.22",
]
